name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The lockfile pins every dependency.
      - run: npm ci
      - run: npm run test:run
      - run: npm run build

      # The package as consumers resolve it: its metadata, and its types under every module setting
      - run: npm run publint
      - run: npm run check:types

      # Lists what would ship, so a stray file in the package shows up in the log.
      - run: npm pack --dry-run
